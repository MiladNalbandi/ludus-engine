name: Release

on:
  push:
    tags: ['v*']

  # A tag push runs this file as it existed at the tagged commit, so a bug in the release job
  # can only ever be fixed for tags that do not exist yet. That is not much use the first time
  # one bites. Dispatching runs the file from the default branch and checks the tag out, which
  # means an already-published tag can be released with a corrected workflow and without being
  # moved to a different commit.
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to release, for example v2.0.0
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve what is being released
        id: target
        run: |
          REF="${{ inputs.tag || github.ref_name }}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"
          # Container registries reject uppercase repository names, and github.repository_owner
          # carries the owner's login exactly as they typed it when they signed up. The service
          # is published as `wavemaker`, not under the repository's name, so a deployment that
          # still holds the Java engine's image can never pick it up by mistake.
          echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/wavemaker" \
            >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # A tag never becomes a release without a green build. Publishing something that was not
      # tested is how a broken version ends up permanently in a registry.
      - name: Verify
        working-directory: service
        run: |
          pip install -e ".[dev]"
          lint-imports
          python -m ruff check .
          python -m mypy .
          python -m pytest -q

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/Dockerfile.service
          # arm64 as well as amd64: plenty of contributors and small deployments are arm.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.target.outputs.image }}:${{ steps.target.outputs.version }}
            ${{ steps.target.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          # Explicit, because a dispatched run's ref is the branch it was dispatched from.
          tag_name: ${{ steps.target.outputs.ref }}
          generate_release_notes: true
