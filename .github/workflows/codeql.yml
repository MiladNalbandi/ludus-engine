name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published rule finds existing code rather than waiting for a push.
    - cron: '17 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The service and the workflows. Neither needs building to be analysed: CodeQL reads
        # Python and workflow files from source, so there is no toolchain to set up and no
        # autobuild step to guess at one.
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          # `languages`, plural. This once said `language`, which the action does not recognise
          # -- it warned, ignored it, and auto-detected every language in the repository instead.
          # So each matrix job quietly analysed everything, both jobs uploaded overlapping results
          # for the same commit, and whichever upload was processed second was rejected.
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:${{ matrix.language }}
