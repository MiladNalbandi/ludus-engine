name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Runs unit tests, the schema conformance tests, the architecture rules and the
      # enforcer bans. The project this was extracted from never ran a test in CI; that is
      # not repeated here.
      - name: Verify
        run: ./mvnw -B verify

      # The snapshot is committed, so `verify` above already compared against it and a drift
      # failed the build. This step exists for the reviewer: it prints the difference rather than
      # leaving them to infer it from an assertion message.
      - name: Show the contract diff if it moved
        if: failure()
        run: git --no-pager diff -- docs/api/openapi.json

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          retention-days: 7
          if-no-files-found: ignore

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # gitleaks scans the whole history, not just the diff
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  editor:
    name: Editor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Install exactly what the lockfile says
        working-directory: editor
        run: npm ci

      # Before anything else: if the wave schema moved and the generated types did not, the rest
      # of this job would be checking the editor against a contract the engine no longer has.
      - name: The generated wave types match the schema
        working-directory: editor
        run: npm run verify:types

      - name: Types
        working-directory: editor
        run: npm run typecheck

      - name: Lint
        working-directory: editor
        run: npm run lint

      - name: Tests
        working-directory: editor
        run: npm test

      - name: Build
        working-directory: editor
        env:
          LUDUS_ENGINE_URL: http://localhost:8080
        run: npm run build

  stack:
    name: Quickstart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The README promises that a clone plus two commands gives a running engine. This job
      # is what stops that promise from quietly becoming false.
      - name: Bring the stack up exactly as the README describes
        run: |
          # The same three values the getting-started guide tells a reader to set, generated
          # the same way. The signing secret has no default and the engine refuses to start
          # without one, so a quickstart that did not set it would only ever prove that.
          sed -e 's/^LUDUS_DB_PASSWORD=.*/LUDUS_DB_PASSWORD=ci-not-a-real-password/' \
              -e "s|^LUDUS_JWT_SECRET=.*|LUDUS_JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')|" \
              -e 's/^LUDUS_ADMIN_EMAIL=.*/LUDUS_ADMIN_EMAIL=ci@example.test/' \
              -e 's/^LUDUS_ADMIN_PASSWORD=.*/LUDUS_ADMIN_PASSWORD=ci-not-a-real-password/' \
            deploy/.env.example > deploy/.env
          docker compose -f deploy/docker-compose.yml up -d --build

      - name: Wait for the engine to report healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "engine is up after ${i}0s"; exit 0
            fi
            sleep 10
          done
          echo "engine did not become healthy"; exit 1

      - name: The API contract is served
        run: curl -fsS http://localhost:8080/api-docs | grep -q 'Ludus Engine API'

      - name: Anything not deliberately open needs a credential
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/anything)
          test "$status" = "401" || { echo "expected 401, got $status"; exit 1; }

      # Signing in is the one flow a reader is promised will work after two commands, and it is
      # the only one of these steps that touches the database, the migrations, the seeded
      # administrator and the filter chains all at once.
      - name: An administrator can sign in and is recognised
        run: |
          token=$(curl -fsS http://localhost:8080/api/v1/auth/token \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.test","password":"ci-not-a-real-password"}' \
            | sed -n 's/.*"accessToken":"\([^"]*\)".*/\1/p')
          test -n "$token" || { echo "no access token in the response"; exit 1; }
          curl -fsS http://localhost:8080/api/v1/me -H "Authorization: Bearer $token" \
            | grep -q '"role":"ADMIN"' || { echo "/api/v1/me did not report an admin"; exit 1; }

      # The generated jsonb column is PostgreSQL-only, so H2 never creates it and no unit test can
      # say anything true about it. This is the only place a claim about it is worth making.
      - name: The generated jsonb column is derived from the stored bytes
        run: |
          docker compose -f deploy/docker-compose.yml exec -T postgres \
            psql -U ludus -d ludus -tAc \
            "select column_name, is_generated from information_schema.columns
              where table_name = 'wave' and column_name in ('config_json','config')
              order by column_name;" | tee /tmp/cols.txt
          grep -q '^config|ALWAYS$'   /tmp/cols.txt || { echo "config is not generated"; exit 1; }
          grep -q '^config_json|NEVER$' /tmp/cols.txt || { echo "config_json is generated"; exit 1; }

      # The client's whole story against the real database: author, publish, fetch with no
      # credential, then re-fetch with the ETag and get nothing back. Every unit test around this
      # runs on H2 and against a mocked clock; this is the only place it happens for real.
      - name: A game client can fetch published content and cache it
        run: |
          token=$(curl -fsS http://localhost:8080/api/v1/auth/token \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.test","password":"ci-not-a-real-password"}' \
            | sed -n 's/.*"accessToken":"\([^"]*\)".*/\1/p')

          curl -fsS http://localhost:8080/api/v1/admin/waves \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            --data-binary @samples/waves/demo_first_steps.json > /dev/null
          curl -fsS -X POST http://localhost:8080/api/v1/admin/waves/demo_first_steps/publish \
            -H "Authorization: Bearer $token" > /dev/null

          # No credential from here on.
          etag=$(curl -fsSi http://localhost:8080/api/v1/public/waves \
                 | tr -d '\r' | sed -n 's/^[Ee][Tt]ag: //p')
          test -n "$etag" || { echo "no ETag on the wave list"; exit 1; }

          hash=$(curl -fsS http://localhost:8080/api/v1/public/status \
                 | sed -n 's/.*"contentHash":"\([^"]*\)".*/\1/p')
          test "$etag" = "\"$hash\"" || {
            echo "the status hash and the list ETag disagree: $hash vs $etag"; exit 1; }

          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/public/waves \
                   -H "If-None-Match: $etag")
          test "$status" = "304" || { echo "expected 304, got $status"; exit 1; }

          # And the document comes back exactly as it was authored.
          curl -fsS http://localhost:8080/api/v1/public/waves/demo_first_steps/raw \
            | diff - samples/waves/demo_first_steps.json \
            || { echo "the served document is not the authored bytes"; exit 1; }

      - name: An uploaded clip outlives the container that received it
        run: |
          token=$(curl -fsS http://localhost:8080/api/v1/auth/token \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.test","password":"ci-not-a-real-password"}' \
            | sed -n 's/.*"accessToken":"\([^"]*\)".*/\1/p')

          head -c 3000000 /dev/urandom > /tmp/clip.ogg

          id=$(curl -fsS http://localhost:8080/api/v1/admin/audio \
            -H "Authorization: Bearer $token" \
            -F 'file=@/tmp/clip.ogg;type=audio/ogg' \
            | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')
          test -n "$id" || { echo "no clip id came back from the upload"; exit 1; }

          # The whole reason the bytes are on a volume rather than in the container. A bind
          # mount that silently wrote into the container's own filesystem would pass every
          # test up to this line and lose every clip on the next deploy.
          docker compose -f deploy/docker-compose.yml restart engine
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"' && break
            sleep 5
          done
          curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"' \
            || { echo "the engine did not come back after a restart"; exit 1; }

          # No credential: published audio is public, and the bytes must be the bytes.
          curl -fsS "http://localhost:8080/api/v1/public/audio/$id" | diff - /tmp/clip.ogg \
            || { echo "the served clip is not the uploaded bytes"; exit 1; }

          code=$(curl -s -o /dev/null -w '%{http_code}' \
                 "http://localhost:8080/api/v1/public/audio/00000000-0000-0000-0000-000000000000")
          test "$code" = "404" || { echo "expected 404 for an unknown clip, got $code"; exit 1; }

      - name: The editor comes up and serves its login page
        run: |
          for i in $(seq 1 40); do
            curl -fsS http://localhost:3000/login >/dev/null 2>&1 && break
            sleep 5
          done
          body=$(curl -fsS http://localhost:3000/login) || {
            echo "the editor did not serve its login page"
            docker compose -f deploy/docker-compose.yml logs editor | tail -40
            exit 1
          }
          echo "$body" | grep -q "Sign in" || {
            echo "the editor served something, but not the login page"; exit 1; }

          # The refresh cookie must be httpOnly. The whole reason the access token is held in
          # memory is that this cookie is the thing a script cannot read, and a flag that silently
          # stopped being set would leave the session stealable with nothing failing anywhere.
          cookie=$(curl -fsS -i -X POST http://localhost:3000/api/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.test","password":"ci-not-a-real-password"}' \
            | tr -d '\r' | grep -i '^set-cookie:' || true)
          test -n "$cookie" || { echo "no session cookie was set on login"; exit 1; }
          echo "$cookie" | grep -qi 'HttpOnly' || {
            echo "the refresh cookie is not HttpOnly: $cookie"; exit 1; }
          echo "$cookie" | grep -qi 'SameSite=Lax' || {
            echo "the refresh cookie is not SameSite=Lax: $cookie"; exit 1; }

          # And the access token must come back in the body, not in a readable cookie.
          curl -fsS -X POST http://localhost:3000/api/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.test","password":"ci-not-a-real-password"}' \
            | grep -q '"accessToken"' || {
              echo "login did not return an access token in the body"; exit 1; }

      # The journey from #9's acceptance criteria, in a real browser against this stack: log in,
      # build, preview, save, publish, and fetch the result from the public API. It runs here
      # rather than in its own job because this is the only place the editor container, the engine,
      # PostgreSQL and the volume are all up at once, and standing that up twice costs minutes for
      # nothing.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Install the editor's test dependencies
        working-directory: editor
        run: npm ci

      - name: Install the browser Playwright drives
        working-directory: editor
        run: npx playwright install --with-deps chromium

      - name: The whole journey, in a browser
        working-directory: editor
        env:
          CI: 'true'
          LUDUS_EDITOR_URL: http://localhost:3000
          LUDUS_ENGINE_URL: http://localhost:8080
          LUDUS_E2E_EMAIL: ci@example.test
          LUDUS_E2E_PASSWORD: ci-not-a-real-password
        run: npm run e2e

      - name: The browser trace, when it failed
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: editor/playwright-report/
          retention-days: 7

      # The import CLI, against the running engine. An acceptance criterion of v1.0.0, and the
      # only way to know the script still works: it talks to the bulk endpoint, which is the one
      # place a malformed document is refused all-or-nothing rather than half-applied.
      - name: The import CLI round-trips the demo content
        run: |
          # The demo waves are already imported by an earlier step, so re-importing them would be
          # a replace rather than a create. Renamed copies make this a real import.
          mkdir -p /tmp/import
          for f in samples/waves/*.json; do
            id="cli_$(basename "$f" .json)"
            sed -e "s/\"$(basename "$f" .json)\"/\"$id\"/" \
                -e "s/\"order\": *[0-9]*/\"order\": $((RANDOM % 500 + 7000))/" \
                "$f" > "/tmp/import/$id.json"
          done

          node scripts/import-waves.mjs \
            --url http://localhost:8080 \
            --email ci@example.test --password ci-not-a-real-password \
            /tmp/import/*.json

          # And the engine has them, as drafts: the importer must not publish anything.
          token=$(curl -fsS http://localhost:8080/api/v1/auth/token \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.test","password":"ci-not-a-real-password"}' \
            | sed -n 's/.*"accessToken":"\([^"]*\)".*/\1/p')

          for f in /tmp/import/*.json; do
            id=$(basename "$f" .json)
            curl -fsS "http://localhost:8080/api/v1/admin/waves/$id" \
              -H "Authorization: Bearer $token" > /tmp/roundtrip.json \
              || { echo "the importer did not create $id"; exit 1; }

            # Byte-for-byte. The importer sends the file's bytes and the engine stores what it
            # receives, so anything else means something on the path re-serialised the document.
            diff "$f" /tmp/roundtrip.json || {
              echo "$id came back different from what was imported"; exit 1; }

            curl -fsS "http://localhost:8080/api/v1/public/waves/$id/raw" >/dev/null 2>&1 && {
              echo "$id was published by the importer; it must leave everything as a draft"
              exit 1
            }
          done

          # A bad document must reject the whole batch and write nothing.
          echo '{"id":"cli_broken","name":"no schema version or anything else"}' > /tmp/import-bad.json
          if node scripts/import-waves.mjs \
               --url http://localhost:8080 \
               --email ci@example.test --password ci-not-a-real-password \
               /tmp/import/cli_demo_first_steps.json /tmp/import-bad.json; then
            echo "the importer accepted an invalid document"; exit 1
          fi
          curl -fsS "http://localhost:8080/api/v1/admin/waves/cli_broken" \
            -H "Authorization: Bearer $token" >/dev/null 2>&1 && {
            echo "a refused import still wrote something"; exit 1; }
          echo "the import CLI round-trips, and refuses all-or-nothing"

      - name: A wrong password is refused
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/auth/token \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.test","password":"wrong"}')
          test "$status" = "401" || { echo "expected 401, got $status"; exit 1; }

      - name: Engine logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color engine

      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
