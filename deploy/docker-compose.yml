name: ludus

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${LUDUS_DB_NAME:-ludus}
      POSTGRES_USER: ${LUDUS_DB_USER:-ludus}
      POSTGRES_PASSWORD: ${LUDUS_DB_PASSWORD:?set LUDUS_DB_PASSWORD in deploy/.env}
    volumes:
      - ludus-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LUDUS_DB_USER:-ludus} -d ${LUDUS_DB_NAME:-ludus}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    # Not published to the host. Nothing outside this stack needs to reach the database.

  engine:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.engine
    image: ghcr.io/miladnalbandi/ludus-engine:${LUDUS_VERSION:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LUDUS_DB_HOST: postgres
      LUDUS_DB_PORT: 5432
      LUDUS_DB_NAME: ${LUDUS_DB_NAME:-ludus}
      LUDUS_DB_USER: ${LUDUS_DB_USER:-ludus}
      LUDUS_DB_PASSWORD: ${LUDUS_DB_PASSWORD}
      LUDUS_LOG_LEVEL: ${LUDUS_LOG_LEVEL:-INFO}
      LUDUS_TENANCY_MODE: ${LUDUS_TENANCY_MODE:-single}
      # Required, with no default anywhere. Compose refuses here rather than letting the
      # container start and exit, because a message from compose names the file to edit and a
      # container that died needs someone to go and read its logs first.
      LUDUS_JWT_SECRET: "${LUDUS_JWT_SECRET:?set LUDUS_JWT_SECRET in deploy/.env, generated with `openssl rand -base64 48`}"
      LUDUS_JWT_ISSUER: ${LUDUS_JWT_ISSUER:-ludus}
      LUDUS_JWT_ACCESS_TTL: ${LUDUS_JWT_ACCESS_TTL:-15m}
      LUDUS_JWT_REFRESH_TTL: ${LUDUS_JWT_REFRESH_TTL:-30d}
      # Optional. Only used to create the first administrator of an empty project; once one
      # exists these do nothing, so an install past its first start can leave them unset.
      LUDUS_ADMIN_EMAIL: ${LUDUS_ADMIN_EMAIL:-}
      LUDUS_ADMIN_PASSWORD: ${LUDUS_ADMIN_PASSWORD:-}
      # Audio bytes live on a volume rather than in the database. Losing this volume loses every
      # uploaded clip while the rows describing them survive, so it is a real backup target.
      LUDUS_AUDIO_DIRECTORY: /var/lib/ludus/audio
      LUDUS_AUDIO_MAX_FILE_SIZE: ${LUDUS_AUDIO_MAX_FILE_SIZE:-64MB}
      # Mixing is off unless this is 'ffmpeg' AND the image actually carries FFmpeg, which the
      # standard one does not. See deploy/Dockerfile.engine-ffmpeg.
      LUDUS_AUDIO_MIXER_MODE: ${LUDUS_AUDIO_MIXER_MODE:-none}
      LUDUS_AUDIO_MIXER_TIMEOUT: ${LUDUS_AUDIO_MIXER_TIMEOUT:-60s}
      LUDUS_AUDIO_MIXER_MAX_TRACKS: ${LUDUS_AUDIO_MIXER_MAX_TRACKS:-8}
    volumes:
      - ludus-audio:/var/lib/ludus/audio
    ports:
      # Bound to loopback by default. Put a reverse proxy in front before exposing this;
      # /actuator/prometheus is reachable by anything that can reach the port.
      - "127.0.0.1:${LUDUS_PORT:-8080}:8080"
    restart: unless-stopped

  editor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.editor
    image: ghcr.io/miladnalbandi/ludus-editor:${LUDUS_VERSION:-latest}
    depends_on:
      engine:
        condition: service_started
    environment:
      # The engine on the compose network, not through the published port. The browser never
      # talks to the engine directly -- every call goes through the editor's own route handlers --
      # so the engine does not have to be reachable from outside at all.
      LUDUS_ENGINE_URL: http://engine:8080
      # Off by default, because a Secure cookie is silently dropped over plain HTTP and "silently
      # dropped" reads as "logged out again" with nothing in any log. Set it to true once the
      # editor is served over HTTPS, which is also when it starts to matter.
      LUDUS_EDITOR_HTTPS: ${LUDUS_EDITOR_HTTPS:-false}
    ports:
      - "127.0.0.1:${LUDUS_EDITOR_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  ludus-db:
  ludus-audio:
