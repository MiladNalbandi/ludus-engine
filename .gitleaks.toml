# Secret scanning runs on every push and on the full history. This repository is public and
# starts from an empty history precisely so nothing has to be redacted after the fact.
title = "Ludus Engine"

[extend]
useDefault = true

# One table, not an array of tables. gitleaks 8.24 decodes the global allowlist as a map, and
# an array here fails config loading outright — which does not fail the scan, it fails *before*
# the scan, so the job errors without ever having looked at the repository.
[allowlist]
description = "Licence texts, sample content, and documented placeholders. None are credentials."
paths = [
  '''LICENSE''',
  '''contracts/LICENSE''',
  '''sdk/unity/LICENSE''',
  '''samples/waves/.*\.json''',
]
regexes = [
  '''change-me-[a-z-]+''',
  '''ludus_dev_[a-z0-9_]+''',
]
