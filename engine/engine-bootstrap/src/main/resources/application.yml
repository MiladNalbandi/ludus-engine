spring:
  application:
    name: ludus-engine
  autoconfigure:
    exclude:
      # Still excluded. Authentication is done by two filters that verify a token or an API key
      # against the database; nothing here registers a UserDetailsService, so Boot's default
      # would still apply — an in-memory user with a random password logged on every start,
      # which nothing can authenticate against and which reads as a credential someone might
      # try to use. It goes when there is a real UserDetailsService to replace it.
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${LUDUS_DB_HOST:localhost}:${LUDUS_DB_PORT:5432}/${LUDUS_DB_NAME:ludus}
    username: ${LUDUS_DB_USER:ludus}
    password: ${LUDUS_DB_PASSWORD:}
  servlet:
    multipart:
      # A clip is streamed to disk rather than buffered, so the in-memory threshold is small on
      # purpose: anything past it spills to a temp file, which is what we want for all of it.
      file-size-threshold: 64KB
      max-file-size: ${LUDUS_AUDIO_MAX_FILE_SIZE:64MB}
      max-request-size: ${LUDUS_AUDIO_MAX_FILE_SIZE:64MB}
  jpa:
    open-in-view: false
    hibernate:
      # Never 'update'. The schema is owned by Flyway; 'validate' turns a drift between an
      # entity and a migration into a failed boot instead of a silent divergence.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/vendor/{vendor}
    baseline-on-migrate: false
    fail-on-missing-locations: false

server:
  port: ${LUDUS_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        # Metrics export is opt-in from Spring Boot 3.5 onwards; without this the scrape
        # endpoint is never registered and /actuator/prometheus quietly 404s.
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /docs

ludus:
  version: ${LUDUS_VERSION:0.0.1-SNAPSHOT}
  tenancy:
    # 'single' resolves every request to the seeded default project and is what a self-hosted
    # install wants. 'multi' arrives in the SaaS phase; the project boundary exists in the
    # schema from the first migration so that switch is configuration, not a rewrite.
    mode: ${LUDUS_TENANCY_MODE:single}
  audio:
    # Where clip bytes are written. Not the database: audio is large, immutable once uploaded and
    # streamed straight out, none of which benefits from a bytea column -- and all of which makes
    # backups larger and restores slower. Must be a volume that survives a restart; compose
    # provides one. The engine refuses to start if it is unset or unwritable.
    directory: ${LUDUS_AUDIO_DIRECTORY:}
    mixer:
      # 'none' by default, and the standard image carries no FFmpeg to switch it to. Mixing needs
      # the ludus-engine-ffmpeg image: a self-hoster is never asked to install a media toolchain
      # to get a working engine.
      mode: ${LUDUS_AUDIO_MIXER_MODE:none}
      # An absolute path, not a name resolved against PATH. "Whatever ffmpeg means in this
      # environment" is not something to hand a subprocess.
      binary: ${LUDUS_AUDIO_MIXER_BINARY:/usr/bin/ffmpeg}
      # A hard stop. FFmpeg can be made to run for a very long time on a small input, and a request
      # that never returns is a denial of service with extra steps.
      timeout: ${LUDUS_AUDIO_MIXER_TIMEOUT:60s}
      # A filter graph can produce far more than it consumes, onto a disk shared with the clips.
      max-output-bytes: ${LUDUS_AUDIO_MIXER_MAX_OUTPUT_BYTES:67108864}
      max-tracks: ${LUDUS_AUDIO_MIXER_MAX_TRACKS:8}
  sprite:
    # Item art, on its own volume. Same shape as the audio directory and the same rules: it must
    # survive a container restart, and the engine refuses to start if it is unset or unwritable.
    directory: ${LUDUS_SPRITE_DIRECTORY:}
  security:
    jwt:
      # Deliberately no default. A signing secret published in a public repository lets anyone
      # forge a token for every install that kept it, so the engine refuses to start without
      # one rather than starting insecurely. Generate: openssl rand -base64 48
      secret: ${LUDUS_JWT_SECRET:}
      issuer: ${LUDUS_JWT_ISSUER:ludus}
      # Short, because an access token cannot be revoked: this is also how long a stolen
      # session survives after someone signs out.
      access-token-ttl: ${LUDUS_JWT_ACCESS_TTL:15m}
      # Long, because this one can be revoked, which is the whole reason it exists.
      refresh-token-ttl: ${LUDUS_JWT_REFRESH_TTL:30d}
    admin:
      # The first administrator, created only into a project that has no users. Also no
      # default: an install with a known administrator password is compromised on first boot.
      email: ${LUDUS_ADMIN_EMAIL:}
      password: ${LUDUS_ADMIN_PASSWORD:}

logging:
  level:
    root: INFO
    io.ludus: ${LUDUS_LOG_LEVEL:INFO}
